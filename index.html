<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GakuEmergencias</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b4d3e">
  <style>
    :root {
      --verde-principal: #1b4d3e;
      --verde-oscuro: #113328;
      --crema-fondo: #fcfbf7;
      --crema-tarjeta: #ffffff;
      --crema-suave: #f4f1ea;
      --dorado: #d4af37;
      --dorado-brillo: #f3e5ab;
      --texto-oscuro: #2c3531;
      --texto-mutado: #66706b;
      --rojo-alerta: #c0392b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--crema-fondo); color: var(--texto-oscuro); padding: 15px; }

    /* Encabezado e Insignia */
    header {
      background: linear-gradient(135deg, var(--verde-principal), var(--verde-oscuro));
      color: #ffffff;
      padding: 20px 15px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border-bottom: 4px solid var(--dorado);
    }

    .insignia-container {
      width: 90px;
      height: 90px;
      margin: 0 auto 12px auto;
      border-radius: 50%;
      background-color: var(--crema-fondo);
      border: 3px solid var(--dorado);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .insignia-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Si no hay imagen aún, se muestra este texto */
    .insignia-placeholder {
      font-size: 11px;
      color: var(--verde-principal);
      font-weight: bold;
      text-align: center;
      padding: 5px;
    }

    h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; color: #ffffff; }
    #status { font-size: 13px; margin-top: 6px; color: var(--dorado-brillo); font-weight: 600; }

    /* Filtros y Búsqueda */
    .filtros {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    select, input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--crema-suave);
      border-radius: 8px;
      background-color: #ffffff;
      font-size: 14px;
      color: var(--texto-oscuro);
      outline: none;
      transition: border-color 0.3s;
    }

    select:focus, input:focus {
      border-color: var(--verde-principal);
    }

    .busqueda-box { margin-bottom: 20px; }

    /* Tarjetas de Alumnos */
    .grid-alumnos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }

    .card {
      background-color: var(--crema-tarjeta);
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border-left: 5px solid var(--verde-principal);
      border-top: 1px solid var(--crema-suave);
      border-right: 1px solid var(--crema-suave);
      border-bottom: 1px solid var(--crema-suave);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--crema-suave);
      padding-bottom: 6px;
    }

    .card-title { font-size: 16px; font-weight: bold; color: var(--verde-principal); }
    .badge-grado {
      background-color: var(--dorado-brillo);
      color: var(--verde-oscuro);
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid var(--dorado);
    }

    .card-info { font-size: 13px; color: var(--texto-oscuro); margin-bottom: 4px; }
    .card-info span { color: var(--texto-mutado); font-weight: 600; }

    .alerta-medica {
      background-color: #fdf2f2;
      color: var(--rojo-alerta);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 8px;
      border-left: 3px solid var(--rojo-alerta);
    }

    .btn-llamar {
      display: inline-block;
      width: 100%;
      text-align: center;
      background-color: var(--verde-principal);
      color: #ffffff;
      text-decoration: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      margin-top: 10px;
      border: 1px solid var(--dorado);
    }

    .btn-llamar:active { background-color: var(--verde-oscuro); }
  </style>
</head>
<body>

  <header>
    <!-- ESPACIO PARA LA INSIGNIA -->
    <div class="insignia-container">
      <!-- Reemplaza "insignia.png" por la ruta de tu imagen cuando la subas a GitHub -->
      <img src="insignia.png" alt="Insignia" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="insignia-placeholder" style="display:none;">LOGOTIPO / INSIGNIA</div>
    </div>
    
    <h1>GakuEmergencias</h1>
    <div id="status">Cargando datos...</div>
  </header>

  <div class="filtros">
    <select id="selectGrado" onchange="filtrarAlumnos()">
      <option value="">Todos los Grados</option>
      <option value="1°">1° Grado</option>
      <option value="2°">2° Grado</option>
      <option value="3°">3° Grado</option>
      <option value="4°">4° Grado</option>
      <option value="5°">5° Grado</option>
      <option value="6°">6° Grado</option>
    </select>

    <select id="selectSeccion" onchange="filtrarAlumnos()">
      <option value="">Todas las Secciones</option>
      <option value="A">Sección A</option>
      <option value="B">Sección B</option>
      <option value="C">Sección C</option>
    </select>
  </div>

  <div class="busqueda-box">
    <input type="text" id="inputBuscar" placeholder="Buscar por Apellido o Nombre..." onkeyup="filtrarAlumnos()">
  </div>

  <div id="contenedorAlumnos" class="grid-alumnos"></div>

  <script>
    // COLOCA AQUÍ TU URL REAL DE GOOGLE APPS SCRIPT
    const API_URL = "https://script.google.com/macros/s/AKfycbw2y5DnhCAqJxO8ITkTOlpZiRHdEuaKrMDHcJx4jS37bfUP0zOhp6UO5YR-QX0hL1QP/exec"; 
    
    let listaAlumnos = [];

    async function cargarDatos() {
      const statusDiv = document.getElementById("status");
      try {
        const respuesta = await fetch(API_URL);
        listaAlumnos = await respuesta.json();
        localStorage.setItem("gaku_alumnos_db", JSON.stringify(listaAlumnos));
        statusDiv.innerHTML = "✅ Sincronizado con Google Sheets";
        mostrarAlumnos(listaAlumnos);
      } catch (error) {
        const datosGuardados = localStorage.getItem("gaku_alumnos_db");
        if (datosGuardados) {
          listaAlumnos = JSON.parse(datosGuardados);
          statusDiv.innerHTML = "⚡ Datos locales listos (Modo Offline)";
          mostrarAlumnos(listaAlumnos);
        } else {
          statusDiv.innerHTML = "⚠️ Sin conexión y sin datos locales";
        }
      }
    }

    function mostrarAlumnos(alumnos) {
      const contenedor = document.getElementById("contenedorAlumnos");
      contenedor.innerHTML = "";

      if (alumnos.length === 0) {
        contenedor.innerHTML = "<p style='text-align:center; grid-column: 1/-1; color: var(--texto-mutado);'>No se encontraron alumnos.</p>";
        return;
      }

      alumnos.forEach(al => {
        const tarjeta = document.createElement("div");
        tarjeta.className = "card";
        
        let alertaHtml = al.Alerta_Medica ? `<div class="alerta-medica">⚠️ ${al.Alerta_Medica}</div>` : "";
        let telefonoHtml = al.Telefono_Apoderado ? `<a href="tel:${al.Telefono_Apoderado}" class="btn-llamar">📞 Llamar Apoderado</a>` : "";

        tarjeta.innerHTML = `
          <div class="card-header">
            <div class="card-title">${al.Apellidos || ''}, ${al.Nombres || ''}</div>
            <span class="badge-grado">${al.Grado || ''} "${al.Seccion || ''}"</span>
          </div>
          <div class="card-info"><span>Apoderado:</span> ${al.Apoderado || 'No registrado'}</div>
          <div class="card-info"><span>Teléfono:</span> ${al.Telefono_Apoderado || 'Sin número'}</div>
          ${alertaHtml}
          ${telefonoHtml}
        `;
        contenedor.appendChild(tarjeta);
      });
    }

    function filtrarAlumnos() {
      const grado = document.getElementById("selectGrado").value.toLowerCase();
      const seccion = document.getElementById("selectSeccion").value.toLowerCase();
      const busqueda = document.getElementById("inputBuscar").value.toLowerCase();

      const filtrados = listaAlumnos.filter(al => {
        const coincideGrado = !grado || (al.Grado && al.Grado.toString().toLowerCase().includes(grado));
        const coincideSeccion = !seccion || (al.Seccion && al.Seccion.toString().toLowerCase().includes(seccion));
        const coincideNombre = !busqueda || 
          (al.Nombres && al.Nombres.toLowerCase().includes(busqueda)) || 
          (al.Apellidos && al.Apellidos.toLowerCase().includes(busqueda));

        return coincideGrado && coincideSeccion && coincideNombre;
      });

      mostrarAlumnos(filtrados);
    }

    // Registro del Service Worker para soporte PWA Offline
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    cargarDatos();
  </script>
</body>
</html>
